<!DOCTYPE html>
<!--/*
  PAGE: Admin login
  URL: GET /admin/login (show). The form POSTs to /admin/login, which Spring Security processes
       itself using the ADMIN filter chain (SecurityConfig.adminFilterChain).
  SERVED BY: AuthenticationController.showAdminLoginForm()
  ACCESS: public page; only accounts with is_admin = true (ROLE_ADMIN) can log in successfully.
  DATA RECEIVED: errorMessage (after ?error).
  NOTE: this template was MISSING in the original project, so opening /admin/login crashed with a
  "Template might not exist" error. This minimal page fixes that. The admin dashboard (/admin)
  itself is not built yet.
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChalO · Admin login</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1d1a; color: #e8f1ee;
               display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
        .card { background: #162a25; padding: 2rem; border-radius: 14px; width: 100%; max-width: 380px; }
        h1 { margin: 0 0 1.2rem; font-size: 1.4rem; }
        label { display: block; margin: .8rem 0 .3rem; font-size: .85rem; }
        input { width: 100%; padding: .65rem; border-radius: 8px; border: 1px solid #2c4a42;
                background: #0f1d1a; color: inherit; box-sizing: border-box; }
        button { margin-top: 1.2rem; width: 100%; padding: .75rem; border: 0; border-radius: 8px;
                 background: #2e9e7b; color: #fff; font-weight: 600; cursor: pointer; }
        .error { background: #5a1f24; padding: .6rem .8rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>ChalO Admin</h1>
    <!-- Shown only when Spring Security redirected here with ?error -->
    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>
    <!-- th:action adds the hidden CSRF token automatically -->
    <form th:action="@{/admin/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
